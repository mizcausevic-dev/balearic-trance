name: Materialize pack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Reassemble tool sources
        run: python3 tools/reassemble.py

      - name: Build
        run: python3 tools/build_pack.py

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Add rendered MIDI pack assets [skip ci]"
            git push origin HEAD:main
          fi
          git fetch origin gh-pages
          git merge origin/gh-pages -s ours --no-edit -m "Sync gh-pages with materialized main [skip ci]" || true
          git push origin HEAD:gh-pages
